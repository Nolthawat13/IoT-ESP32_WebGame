<!doctype html>
<html lang="th">

<style>

.seg{display:flex;gap:8px;justify-content:center}
.sg{flex:1;max-width:150px;font-size:13px;cursor:pointer}
.sg.on{background:#5fe3ff30;border-color:#5fe3ff;color:#fff}

#pw{margin-top:8px;padding:8px 10px;border:1px solid #ffc14a80;border-radius:10px;background:#ffc14a14;color:#ffe3a8;font-size:12.5px;line-height:1.5}

</div>

</div>
</div>
<div class="sub" id="pmsg" style="margin:8px 0 0"></div>
</div>
<div class="sub" id="rs" style="margin:8px 0 0"></div>
<div class="cn">

<option value="ap">Mode: Start</option>
</select>
<div class="row">

</div>
</div></div>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var cv=$("c"),g=cv.getContext("2d"),glowEl=$("glow");

var SCORE_MULTIPLIER_CAP=6;

var FONT='"Segoe UI","Leelawadee UI",Tahoma,sans-serif';
var NAMES=["SYNTHWAVE","FUTURE BASS","LIQUID DNB","TRAP","HARDCORE"];
var BPMS=[100,128,140,140,150];               /* fixed BPM per genre; difficulty comes from note density */
var TH=[["#08404a","#021017","#3de0d0"],["#2c1b58","#0a0718","#c18cff"],["#0b2f60","#030a1c","#4aa8ff"],["#4f3014","#160b05","#ffb04a"],["#531524","#14050a","#ff5a6e"]];
var LC=["#ff4fd8","#43e3ff","#ffe45c"];
/* each genre: 4 base bars of 16 steps. L=left, R=right, B=both (chord), .=rest */
var PAT=[
["L...R...L...R...","L...R...L.R.R...","L.R.R...L...R.L.","L...B...L.R.R..."],
["L...R...L...R...","L.R.R...L.L.R...","L...R.L.L...R.R.","L.R.R.L.L.R.B..."],
["L...R.....L.R...","L...R...L.L.R...","L.L.R.....L.R.R.","L...B.....L.R.L."],
["L.......R.......","L.......R.L.R...","L...L...R.....R.","L.R.....B.L.R.L."],
["L.R.L.R.L.R.L.R.","L.R.R.L.L.R.L.R.","L.R.L.R.R.L.R.B.","L.R.L.L.R.R.L.B."]];

[[2,10],[6,10,14],[2,6,10,14]],
[[7,15],[7,10,14,15],[2,7,10,15]],

   and nothing appears in the first 24 beats so a new player gets time to settle in. */
var HP=[
[0,0,[1,1,2],0,[0,2,1.5],[0,0,3],[1,0,2],0],
[0,[0,0,2],0,[1,2,1.5],0,[1,0,2],[0,1,3],0],
[0,0,[0,0,2],0,[1,1,1.5],[0,0,2],0,0],
[0,[1,0,3],0,[0,0,2],0,[1,0,2],[0,2,2],0],
[0,0,0,[0,0,1],0,[1,0,1],[0,2,1],0]];
var KEY=[110,130.81,98,73.42,82.41];
var CH=[[[0,3],[-4,4],[3,4],[-2,4]],[[0,3],[-4,4],[-2,4],[-5,3]],[[0,3],[3,4],[-4,4],[-2,4]],[[0,3],[0,3],[-4,4],[-2,4]],[[0,3],[0,3],[-2,4],[-2,4]]];
var PS=[0,3,5,7,10,12,15,17],MP=[[0,2,4,2],[4,2,0,3],[0,4,2,5],[2,4,6,4]],MT=["sawtooth","sawtooth","triangle","sine","square"],ML=[2200,3500,2400,2000,3200];

/* ================= helpers ================= */
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}
function rgb(a,al){return"rgba("+(a[0]|0)+","+(a[1]|0)+","+(a[2]|0)+","+(al===undefined?1:al)+")"}
function F(px,w){return(w||700)+" "+px+"px "+FONT}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function rm(k){try{localStorage.removeItem(k)}catch(e){}}
var TG=TH.map(function(t){return t.map(hx)}),cc=TG[0].map(function(a){return a.slice()});

/* ================= state ================= */
var W=0,H=0,cx=0,hy=0,jy=0,hw=0,scl=1,road=null,bandG=null,vigG=null,flashG=[null,null];
var QB=[.55e6,1.1e6,2.2e6],Q=((navigator.hardwareConcurrency||4)>=8&&(navigator.deviceMemory||8)>=8)?2:1,ftAcc=0,ftN=0,qCool=0;
var best=Math.max(0,Number(ls("computer-engineering-rhythm-best-v2"))||0);
var lastScore=Math.max(0,Number(ls("computer-engineering-rhythm-last-v1"))||0);
var uo=Number(ls("rhythm-offset"))||0;
var S="ready",overAt=0,muted=false,tm=0,el=0,lastTs=0,skip=0,P0=0,pauseAt=0;
var beats=[],notes=[],ai=0,bp=0,bt=2.4,gi=0,curBpm=100,bpos=0,gs=0,stg=0,pulse=0;
var lastLane=[-Infinity,-Infinity],holdUntil=[-Infinity,-Infinity],holding=[null,null],hacc=0;
var sc=0,combo=0,maxc=0,lives=5,jtxt="",jat=-9,cbAt=-9,co=null,lastSeg=-1,rec=false;
var lifeGains=0,lifeAt=LIFE_BASE,lifeFrom=0;
var fbLabel="",fbVal=0,fbAt=-9,lf=[0,0],parts=[],rings=[],startChord={l:-1,at:0},toastT="",toastAt=-9999;
var beams=[],fwq=[],flashA=0,flashC="#ffffff",shk=0,vig=0,hpAt=-9,lifeFl=0,hsp=[0,0],rain=0;
var pl={},dn=0,cs="off";

/* ================= periodic score reset ================= */
var PKEY="computer-engineering-rhythm-period",memIdx=null;
function periodIdx(){
  var localMs=Date.now()-new Date().getTimezoneOffset()*60000;
  return Math.floor((localMs-RESET_AT*3600000)/(RESET_HOURS*3600000));
}
/* never touches the scores while a game is running; the check simply happens when the game is idle */
function resetCheck(){
  if(S==="play"||S==="pause")return;
  var idx=periodIdx(),old=ls(PKEY);
  if(old===null&&memIdx!==null)old=String(memIdx);
  memIdx=idx;ss(PKEY,String(idx));
  if(old!==null&&Number(old)!==idx){
    best=0;lastScore=0;
    ss("computer-engineering-rhythm-best-v2","0");ss("computer-engineering-rhythm-last-v1","0");
    if(BOARD_RESET){memBoard="[]";ss(BOARD_KEY,"[]");renderBoard(pm==="name"?pname:"");updatePlayerUI()}
  }
}

/* ================= players & leaderboard ================= */
var memBoard=null,pm=ls("ce_rhythm_pmode")==="name"?"name":"anon",pname=cleanName(ls("ce_rhythm_pname")),pAck="";
function cleanName(v){return Array.from(String(v||"").replace(/[\u0000-\u001f\u007f]/g,"").replace(/\s+/g," ").trim()).slice(0,NAME_MAX).join("").trim()}
function nameKey(n){return n.toLowerCase()}
/* the board is read defensively: localStorage can be edited, so every field is validated */
function loadBoard(){
  var raw=ls(BOARD_KEY),arr=[],out=[],seen=Object.create(null),i,e,n,s,k;
  if(raw===null&&memBoard)raw=memBoard;
  try{arr=JSON.parse(raw||"[]")}catch(err){arr=[]}
  if(!Array.isArray(arr))arr=[];
  for(i=0;i<arr.length;i++){
    e=arr[i];if(!e||typeof e.n!=="string"||!isFinite(e.s))continue;
    n=cleanName(e.n);s=Math.max(0,Math.round(Number(e.s)));if(!n)continue;
    k=nameKey(n);
    if(seen[k]!==undefined){if(s>out[seen[k]].s){out[seen[k]].s=s;out[seen[k]].t=Number(e.t)||0}continue}
    seen[k]=out.length;out.push({n:n,s:s,t:Number(e.t)||0});
  }
  out.sort(function(a,b){return b.s-a.s||a.t-b.t});
  return out.slice(0,BOARD_KEEP);
}
function saveBoard(b){var j=JSON.stringify(b);memBoard=j;ss(BOARD_KEY,j)}
function findEntry(b,name){var k=nameKey(name),i;for(i=0;i<b.length;i++)if(nameKey(b[i].n)===k)return b[i];return null}
function submitScore(name,score){
  var b=loadBoard(),en=findEntry(b,name),prev=en?en.s:0,isNew=false,rank=0,i;
  if(!en&&score>0){en={n:name,s:score,t:Date.now()};b.push(en);isNew=true}
  else if(en&&score>en.s){en.s=score;en.t=Date.now();isNew=true}   /* a lower score never replaces the best */
  b.sort(function(x,y){return y.s-x.s||x.t-y.t});b=b.slice(0,BOARD_KEEP);saveBoard(b);
  for(i=0;i<b.length;i++)if(nameKey(b[i].n)===nameKey(name)){rank=i+1;break}
  return{rank:rank,isNew:isNew,prev:prev,best:Math.max(prev,score)};
}
function scoreName(){return pm==="name"&&pname?pname:ANONYMOUS_NAME}
function boardRow(box,rank,en,me){
  var d=document.createElement("div"),a=document.createElement("b"),n=document.createElement("span"),s=document.createElement("span");
  d.className="r"+(me?" me":"")+(rank<=3?" t"+rank:"");
  a.textContent=String(rank);n.className="n";n.textContent=en.n;s.className="s";s.textContent=fmt(en.s);
  d.appendChild(a);d.appendChild(n);d.appendChild(s);box.appendChild(d);
}
function renderBoard(hl){
  var box=$("bl"),b=loadBoard(),hk=hl?nameKey(hl):"",me=-1,i,n,d;
  box.textContent="";
  if(!b.length){d=document.createElement("div");d.className="e";d.textContent="ยังไม่มีอันดับ · เป็นคนแรกเลย!";box.appendChild(d);return}
  if(hk)for(i=0;i<b.length;i++)if(nameKey(b[i].n)===hk){me=i;break}
  n=Math.min(b.length,BOARD_SHOW);
  for(i=0;i<n;i++)boardRow(box,i+1,b[i],i===me);
  if(me>=BOARD_SHOW){d=document.createElement("div");d.className="e";d.textContent="⋯";box.appendChild(d);boardRow(box,me+1,b[me],true)}
}
function updatePlayerUI(){
  var nm=pm==="name",v=cleanName($("pnm").value),msg=$("pmsg"),en;
  $("pa").className="sg"+(nm?"":" on");$("pn").className="sg"+(nm?" on":"");
  $("pa").setAttribute("aria-pressed",String(!nm));$("pn").setAttribute("aria-pressed",String(nm));
  $("pf").hidden=!nm;$("pw").hidden=true;
  if(!nm){msg.textContent="คะแนนนิรนามจะบันทึกในชื่อ “"+ANONYMOUS_NAME+"” ให้ผู้เล่นคนถัดไปสานต่อ";return}
  if(!v){msg.textContent="กรอกชื่อเล่นเพื่อบันทึกคะแนนลงตาราง";return}
  en=findEntry(loadBoard(),v);
  if(en&&nameKey(v)!==pAck){   /* name already on the board: ask whether it is the same person */
    $("pwt").textContent="ชื่อ “"+en.n+"” มีคนใช้อยู่ในตารางแล้ว (คะแนนสูงสุด "+fmt(en.s)+") · ใช่คุณหรือเปล่า? ถ้าใช่ คะแนนจะนับต่อจากชื่อนี้ ถ้าไม่ใช่ กรุณาเปลี่ยนชื่อ";
    $("pw").hidden=false;msg.textContent="";return;
  }
  msg.textContent=en?"เล่นในชื่อ "+en.n+" · สถิติของคุณ "+fmt(en.s):"ชื่อใหม่ “"+v+"” · พร้อมเริ่ม (กด L + R)";
}
/* L+R only starts a game once the player is settled: anonymous, or a confirmed nickname */
function startAllowed(){
  if(pm!=="name")return true;
  var v=cleanName($("pnm").value);
  updatePlayerUI();
  if(!v){$("pmsg").textContent="กรอกชื่อก่อนเริ่ม หรือเลือก “นิรนาม”";$("pnm").focus();return false}
  if(findEntry(loadBoard(),v)&&nameKey(v)!==pAck){try{$("pw").scrollIntoView({block:"nearest"})}catch(err){}return false}
  pname=v;pAck=nameKey(v);ss("ce_rhythm_pname",v);return true;
}
function overText(res){
  var L=["คะแนน "+fmt(sc)+" · คอมโบสูงสุด "+maxc],sn=scoreName();
  if(res){
    if(res.rank){
      if(res.isNew)L.push(res.prev?"อันดับ #"+res.rank+" · สถิติใหม่ (เดิม "+fmt(res.prev)+")":"เข้าตารางที่อันดับ #"+res.rank);
      else L.push("สถิติสูงสุดของ "+sn+" "+fmt(res.best)+" ยังอยู่อันดับ #"+res.rank);
    }

function initPlayerUI(){
  var inp=$("pnm");inp.value=pname;
  $("pa").addEventListener("click",function(){this.blur();pm="anon";ss("ce_rhythm_pmode","anon");renderBoard(scoreName());updatePlayerUI()});
  $("pn").addEventListener("click",function(){this.blur();pm="name";ss("ce_rhythm_pmode","name");renderBoard(scoreName());updatePlayerUI();if(!cleanName(inp.value))inp.focus()});
  inp.addEventListener("input",function(){ss("ce_rhythm_pname",cleanName(inp.value));updatePlayerUI()});
  $("pyes").addEventListener("click",function(){this.blur();pAck=nameKey(cleanName(inp.value));updatePlayerUI()});

  renderBoard(scoreName());updatePlayerUI();

function emergencyReset(){
  best=0;lastScore=0;sc=0;combo=0;maxc=0;lives=5;

  memBoard="[]";ss(BOARD_KEY,"[]");

/* ================= audio ================= */
var ac=null,master=null,mus=null,sfx=null,dm=null,duck=null,noiseBuf=null,aoff=null,vc=0;
function chord(st,bar){var c=CH[st][bar%4];return{r:KEY[st]*Math.pow(2,c[0]/12),q:c[1]}}
function initAudio(){
  if(ac){if(ac.state==="suspended"&&S!=="pause")ac.resume();return}
  var A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  try{ac=new A({latencyHint:"interactive"});noiseBuf=ac.createBuffer(1,ac.sampleRate*.4|0,ac.sampleRate);
    var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    if(ac.state==="suspended")ac.resume()}catch(e){ac=null}

  g.fillStyle="#fff";g.font=F(u*1.1,700);g.textAlign="left";g.textBaseline="middle";g.fillText("×"+lives,bx+bw+10,by+bh/2);
  /* progress toward the next heart */
  var py2=by+bh+u*.5,full=lives>=LIFE_MAX,pg=full?1:Math.max(0,Math.min(1,(combo-lifeFrom)/Math.max(1,lifeAt-lifeFrom)));
  g.fillStyle="rgba(255,255,255,.12)";g.fillRect(bx,py2-2,bw,4);
  g.fillStyle=full?"#ffe45c":pg>.85?"#ffffff":"#ff9ab5";g.fillRect(bx,py2-2,bw*pg,4);
  g.font=F(u*.6,600);g.textAlign="left";g.fillStyle="rgba(215,235,245,.8)";g.fillText(full?"MAX":Math.min(combo,lifeAt)+"/"+lifeAt,bx+bw+10,py2);
  g.font=F(u*.8,600);g.fillStyle=rgb(cc[2]);g.textAlign="center";g.fillText(Math.round(curBpm)+" BPM · "+NAMES[gs],bx+bw/2,by+bh+u*1.55);
  var px=W-m-u*1.1,py=m+u*1.1;
  var rx=px-u*1.6-u*5.5;g.textAlign="center";
  g.font=F(u*.7,600);g.fillStyle="rgba(215,235,245,.75)";g.fillText("SCORE",rx,py-u*.7);
  g.font=F(u*1.6,700);g.fillStyle="#fff";g.fillText(fmt(sc),rx,py+u*.35);
  g.font=F(u*.65,600);g.fillStyle="rgba(215,235,245,.75)";g.fillText("MAX COMBO  "+fmt(maxc),rx,py+u*1.5);
  g.fillText("LAST SCORE "+fmt(lastScore)+"   BEST "+fmt(best),rx,py+u*2.25);
  g.fillText(pm==="name"&&pname?"PLAYER  "+pname:"ANONYMOUS",rx,py+u*3);
  if(cs==="ok"){g.font=F(u*.7,600);g.fillStyle="#5dff9a";g.fillText("● ESP8266 Connected",cx,H-m)}
}
function scoreFeedback(){
  var age=tm-fbAt;if(!fbLabel||age<0||age>=1)return;
  var m=Math.max(14,W*.018),sL=cx+hw*.55,sR=W-m,maxW=Math.max(50,sR-sL-8),fs=Math.min(H*.08,68),x=(sL+sR)/2,y=H*.5-age*H*.025;
  g.save();g.font=F(fs,800);var tw=g.measureText(fbLabel).width;if(tw>maxW){fs=Math.max(24,fs*maxW/tw);g.font=F(fs,800)}
  g.textAlign="center";g.textBaseline="middle";g.globalAlpha=1-age;
  g.fillStyle=fbVal>0?"#5dff9a":"#ff6f90";g.shadowColor=fbVal>0?"rgba(93,255,154,.8)":"rgba(255,111,144,.8)";g.shadowBlur=fs*.35;
  g.lineJoin="round";g.lineWidth=Math.max(3,fs*.1);g.strokeStyle="rgba(3,17,26,.9)";g.strokeText(fbLabel,x,y);g.fillText(fbLabel,x,y);g.restore();
}
function center(){
  var age=el-jat,u=H*.1,ca=el-cbAt;g.textAlign="center";g.textBaseline="middle";
  if(combo>1){var z=1+Math.max(0,.18-ca)*1.6;g.save();g.translate(cx,H*.3);g.scale(z,z);g.font=F(u,700);g.lineJoin="round";g.lineWidth=u*.09;g.strokeStyle="rgba(120,220,255,.45)";g.strokeText(String(combo),0,0);g.fillStyle="#fff";g.fillText(String(combo),0,0);g.restore()}
  if(jtxt&&age>=0&&age<.7){g.save();g.globalAlpha=1-age/.7;g.font=F(H*.048,700);g.fillStyle=jtxt==="MISS"?"#ff6e8a":jtxt==="PERFECT"?"#e9d2ff":"#bfeaff";g.fillText(jtxt,cx,H*.3+u*.85);g.restore()}
  if(co&&el-co.at<1.6&&el>=co.at){g.save();g.globalAlpha=Math.min(1,(1.6-(el-co.at))*1.5);g.font=F(H*.034,700);g.fillStyle=rgb(cc[2]);g.fillText(co.t,cx,H*.19);g.restore()}
}
function frame(ts){
  if(S!=="play"){skip^=1;if(skip){requestAnimationFrame(frame);return}}
  var dt=Math.min(.05,(ts-lastTs)/1000||0);lastTs=ts;tm+=dt;
  if(S==="play"){
    upd(dt);ftAcc+=dt;ftN++;
    if(ftN>=45){if(ftAcc/ftN>.024&&Q>0&&tm>qCool){setQ(Q-1);qCool=tm+3}ftAcc=0;ftN=0}   /* auto lower quality if slow */
  }else if(S!=="pause"){pulse=0;bpos=tm*1.4;lf[0]=lf[1]=0}
  if(S==="ready")stg=0;
  if(S!=="pause")fxUpd(dt);
  theme(dt);g.clearRect(0,0,W,H);
  g.save();if(shk>.3)g.translate((Math.random()-.5)*shk,(Math.random()-.5)*shk);
  g.drawImage(road,0,0,W,H);
  beatLines();laneFlash();
  if(S==="play"||S==="pause")drawNotes();
  targets();fx();
  g.restore();
  var vv=Math.max(vig,S==="play"&&lives<=1?.28+.18*Math.sin(tm*7):0);   /* red edge: miss flash, and a heartbeat when on the last life */
  if(vv>.02&&vigG){g.globalAlpha=Math.min(1,vv);g.fillStyle=vigG;g.fillRect(0,0,W,H);g.globalAlpha=1}
  if(flashA>.01){g.globalAlpha=Math.min(.6,flashA);g.fillStyle=flashC;g.fillRect(0,0,W,H);g.globalAlpha=1}
  hud();if(S!=="ready")center();scoreFeedback();
  if(performance.now()-toastAt<1400){g.font=F(H*.03,600);g.textAlign="center";g.fillStyle="#fff";g.fillText(toastT,cx,H*.9)}
  requestAnimationFrame(frame);
}

/* ================= input ================= */
var KC={ArrowLeft:0,KeyA:0,KeyL:0,ArrowRight:1,KeyD:1,KeyR:1},KK={a:0,l:0,d:1,r:1};
function laneOf(e){var c=e.code,k=(e.key||"").toLowerCase();return c in KC?KC[c]:(k in KK?KK[k]:-1)}
addEventListener("keydown",function(e){
  if(e.target&&(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")){if(e.key==="Enter")e.target.blur();return}
  if(e.ctrlKey&&e.altKey&&e.shiftKey&&e.code==="KeyX"){e.preventDefault();if(!e.repeat)emergencyReset();return}
  initAudio();var c=e.code,ln=laneOf(e);
  if(ln>=0){e.preventDefault();if(!e.repeat)press(ln);return}
  if(c==="BracketLeft"||c==="BracketRight"){uo=Math.max(-.3,Math.min(.3,uo+(c==="BracketRight"?.01:-.01)));ss("rhythm-offset",String(uo));toastT="ชดเชยเวลา "+Math.round(uo*1000)+" ms";toastAt=performance.now();return}
  if(e.repeat)return;
  if(c==="KeyP"||c==="Escape"){if(S==="play")pause();else if(S==="pause")resume();return}
  if(c==="KeyF"){toggleFs();return}
  if(c==="KeyM"){muted=!muted;if(master)master.gain.value=muted?0:.9;return}
  if(c==="KeyQ"){setQ((Q+1)%3);toastT="Quality "+Q;toastAt=performance.now()}
});
addEventListener("keyup",function(e){var ln=laneOf(e);if(ln>=0)release(ln)});
addEventListener("pointerdown",initAudio,true);
cv.addEventListener("pointerdown",function(e){
  e.preventDefault();if(S!=="play")return;
  var ln=e.clientX<W/2?0:1;pl[e.pointerId]=ln;press(ln);
});
function pup(e){var l=pl[e.pointerId];if(l!==undefined){delete pl[e.pointerId];release(l)}}
addEventListener("pointerup",pup);addEventListener("pointercancel",pup);
$("ov").addEventListener("click",function(e){if(e.target.closest&&e.target.closest(".cn,.pl,#bd"))return;act()});
document.addEventListener("visibilitychange",function(){if(document.hidden&&S==="play")pause()});
function toggleFs(){try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()}catch(err){}}
addEventListener("resize",lay);

/* ================= ESP8266 WebSocket ================= */
var sock=null,want=false,rt=null,ra=0,modeSel=$("modeSel"),epInput=$("ep");
function applyMode(m){
  if(m==="ap"){epInput.value="ws://192.168.4.1:81";epInput.disabled=true}
  else{epInput.disabled=false;epInput.value=ls("ce_rhythm_custom_ip")||"ws://192.168.1.50:81"}
}
modeSel.value=ls("ce_rhythm_mode")||"net";applyMode(modeSel.value);
modeSel.addEventListener("change",function(){
  ss("ce_rhythm_mode",this.value);applyMode(this.value);
  if(sock){want=false;sock.close();setC("เปลี่ยนโหมดแล้ว","off")}
});
epInput.addEventListener("input",function(){if(modeSel.value==="net")ss("ce_rhythm_custom_ip",epInput.value)});
function setC(t,s){$("cl").textContent=t;$("cs").setAttribute("data-s",s);cs=s}
function checkUrl(v){var u;try{u=new URL(v.trim())}catch(e){return null}if((u.protocol!=="ws:"&&u.protocol!=="wss:")||u.username||u.password||u.search||u.hash)return null;return u.toString()}
function retry(){if(!want||rt)return;var d=Math.min(15000,600*Math.pow(1.8,ra));ra=Math.min(ra+1,8);setC("หลุดการเชื่อมต่อ · กำลังลองใหม่","wait");rt=setTimeout(function(){rt=null;openS()},d)}
function onMsg(m){
  /* board sends L / R (tap) and optionally L_DOWN / L_UP / R_DOWN / R_UP (needed for hold notes).
     Once any *_DOWN is seen, plain L / R are ignored so a press is never counted twice. */
  if(m.slice(-5)==="_DOWN")dn=1;
  if(m==="L_DOWN"||(m==="L"&&!dn))press(0);
  else if(m==="R_DOWN"||(m==="R"&&!dn))press(1);
  else if(m==="L_UP")release(0);
  else if(m==="R_UP")release(1);
}
function openS(){
  if(!want)return;if(sock&&(sock.readyState===0||sock.readyState===1))return;
  var a=checkUrl(epInput.value);if(!a){want=false;setC("ที่อยู่ไม่ถูกต้อง (ใช้ ws://IP:พอร์ต)","err");return}
  setC("กำลังเชื่อมต่อ…","wait");var ws;try{ws=new WebSocket(a)}catch(e){retry();return}sock=ws;
  var to=setTimeout(function(){if(sock===ws&&ws.readyState===0)ws.close()},7000);
  ws.onopen=function(){clearTimeout(to);ra=0;setC("เชื่อมต่อบอร์ดแล้ว","ok")};
  ws.onmessage=function(ev){if(sock!==ws||typeof ev.data!=="string"||ev.data.length>16)return;onMsg(ev.data.trim().toUpperCase())};
  ws.onerror=function(){if(sock===ws)setC("เชื่อมต่อไม่สำเร็จ","err")};
  ws.onclose=function(){clearTimeout(to);if(sock!==ws)return;sock=null;if(want)retry();else setC("ยังไม่เชื่อมต่อบอร์ด ESP8266","off")};
}
$("cb").addEventListener("click",function(){this.blur();if(rt){clearTimeout(rt);rt=null}want=true;ra=0;openS()});
$("db").addEventListener("click",function(){this.blur();want=false;if(rt){clearTimeout(rt);rt=null}if(sock){var o=sock;sock=null;try{o.close(1000)}catch(e){}}setC("ยังไม่เชื่อมต่อบอร์ด ESP8266","off")});

/* audio scheduler on its own timer so a slow frame never starves the music */
setInterval(function(){if(S==="play"){ensure(raw()+4);sched()}},30);
resetCheck();setInterval(resetCheck,30000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)resetCheck()});
$("rs").textContent="คะแนนล่าสุด/สูงสุด"+(BOARD_RESET?"และตารางอันดับ":"")+"รีเซ็ตทุก "+RESET_HOURS+" ชม.";
initPlayerUI();
lay();requestAnimationFrame(frame);
})();
